services:
  db:
    image: postgres:16-alpine
    container_name: viafast-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-viafast}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-viafast}
      POSTGRES_DB: ${POSTGRES_DB:-viafast}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - viafast_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-viafast} -d ${POSTGRES_DB:-viafast}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  viafast_pgdata:
